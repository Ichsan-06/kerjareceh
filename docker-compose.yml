version: '3.8'

services:
  # 1. Aplikasi PHP (Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bukudigital-app-image
    container_name: bukudigital-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - bukudigital

  # 2. Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: bukudigital-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - bukudigital

  # 3. Database (MySQL)
  db:
    image: mysql:8.0
    container_name: bukudigital-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      # MYSQL_PASSWORD: bukudigital
      # MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - bukudigital

  # 4. PHPMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: bukudigital-pma
    links:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    restart: always
    ports:
      - 8081:80
    networks:
      - bukudigital

networks:
  bukudigital:
    driver: bridge

volumes:
  dbdata:
    driver: local
