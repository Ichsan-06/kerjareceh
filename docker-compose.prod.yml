services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cuantask-app
    container_name: cuantask-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - cuantask-network

  web:
    image: nginx:alpine
    container_name: cuantask-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - cuantask-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: cuantask-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_ALlOW_EMPTY_PASSWORD: 1
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - cuantask-network

networks:
  cuantask-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
